{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Self-hosted Libertinus: preload the two most frequently used faces. -->
<link rel="preload" href="{{ base_path }}/assets/fonts/libertinus/libertinus-serif-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/libertinus/libertinus-serif-bold.woff2" as="font" type="font/woff2" crossorigin>

<!-- Browser and device icons -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/lucky_0.svg"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<meta name="theme-color" content="#ffffff"/>

<!-- end custom head snippets -->
